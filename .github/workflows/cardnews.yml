name: 카드뉴스 자동 제작·업로드

on:
  workflow_dispatch:
    inputs:
      post:
        description: "인스타에 실제로 올릴까요? (true/false)"
        default: "false"
  schedule:
    - cron: "0 23,1,3,5,7,9,10,11,12,13 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한글 글꼴과 프로그램 설치
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-nanum
          pip install -r requirements.txt
      - name: 카드뉴스 만들기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python generate.py
      - name: 결과 저장
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output used_topics.json
          git commit -m "새 카드뉴스" || true
          git push
      - name: 인스타그램에 올리기
        if: github.event_name == 'schedule' || github.event.inputs.post == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          sleep 30
          python post_instagram.py
